
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1></h1>
  <div id="light">
    <h1 id="h"></h1>
  </div>
  <button onclick="on()">swich on</button>
    <button onclick="off()">swich off</button>
    <script>
      function on(){
       document.getElementById("light").style.backgroundColor="red";
       document.getElementById("light").style.boxShadow="0 100px 100px red";
      document.getElementById("h").innerHTML="ON";
      }
      function off(){
       document.getElementById("light").style.backgroundColor="white";
       document.getElementById("light").style.boxShadow="0 0px 1px red";
document.getElementById("h").innerHTML="OFF";
      }
    </script>
</body>
</html>
